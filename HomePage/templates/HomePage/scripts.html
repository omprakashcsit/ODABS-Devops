<script>
    const modal = document.getElementById("authModal");

    document.querySelectorAll(".open-login").forEach(button => {

        button.onclick = function (e) {

            e.preventDefault();

            modal.style.display = "flex";

            loginForm.style.display = "block";
            registerForm.style.display = "none";

            loginTab.classList.add("active");
            registerTab.classList.remove("active");

        };

    });

    document.querySelectorAll(".open-register").forEach(button => {

        button.onclick = function (e) {

            e.preventDefault();

            modal.style.display = "flex";

            loginForm.style.display = "none";
            registerForm.style.display = "block";

            registerTab.classList.add("active");
            loginTab.classList.remove("active");

        };

    });

    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");

    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");

    const closeModal = document.querySelector(".close-modal");

    loginTab.onclick = function () {

        loginForm.style.display = "block";
        registerForm.style.display = "none";

        loginTab.classList.add("active");
        registerTab.classList.remove("active");

    };

    registerTab.onclick = function () {

        loginForm.style.display = "none";
        registerForm.style.display = "block";

        registerTab.classList.add("active");
        loginTab.classList.remove("active");

    };

    closeModal.onclick = function () {

        modal.style.display = "none";

    };

    window.onclick = function (e) {

        if (e.target === modal) {

            modal.style.display = "none";

        }

    };

    function toggleLoginPassword() {

        const password = document.getElementById("loginPassword");

        if (password.type === "password") {
            password.type = "text";
        } else {
            password.type = "password";
        }

    }

    {% if show_register_modal %}

    modal.style.display = "flex";

    loginForm.style.display = "none";
    registerForm.style.display = "block";

    registerTab.classList.add("active");
    loginTab.classList.remove("active");

    {% endif %}

    const showRegisterModal = "{{ show_register_modal|default:'False' }}" === "True";

    if (showRegisterModal) {
        modal.style.display = "flex";

        loginForm.style.display = "none";
        registerForm.style.display = "block";

        registerTab.classList.add("active");
        loginTab.classList.remove("active");
    }

    const showLoginModal = "{{ show_login_modal|default:'False' }}" === "True";

    if (showLoginModal) {

        modal.style.display = "flex";

        loginForm.style.display = "block";
        registerForm.style.display = "none";

        loginTab.classList.add("active");
        registerTab.classList.remove("active");

    }

    document.querySelectorAll(".book-login-btn").forEach(function (button) {

        button.addEventListener("click", function (e) {

            e.preventDefault();

            // Save where the user wanted to go
            const next = this.dataset.next;

            // Store it so we can use it after login
            sessionStorage.setItem("next_url", next);

            // Open the login modal
            document.getElementById("authModal").style.display = "flex";

            // Make sure the login tab is active
            document.getElementById("loginTab").click();

        });

    });

</script>
