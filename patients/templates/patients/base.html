<!DOCTYPE html>
<html>

<head>

    <title>{% block title %}Patient Portal{% endblock %}</title>
    {% include "HomePage/navbar_css.html" %}

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#F8FAFC;
    margin:0;
}


/* Main */



h1{
    color:#2c3e50;
}

/* Statistics */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin:30px 0;
}

.card{
    background:white;
    border-radius:10px;
    padding:25px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.stat-card{
    text-decoration:none;
    color:inherit;
    transition:.2s ease;
}

.stat-card:hover{
    transform:translateY(-5px);
    box-shadow:0 8px 20px rgba(0,0,0,.15);
    cursor:pointer;
}

.card h2{
    margin:0;
    color:#176235;
}

.card p{
    margin-top:10px;
}

/* Quick buttons */

.actions{
    display:flex;
    gap:20px;
    margin-bottom:40px;
}

.actions .btn{
    flex:1;
    text-align:center;
}

.btn{
    background:#176235;
    color:white;
    padding:5px 12px;
    text-decoration:none;
    border-radius:8px;
}

/* Appointment cards */

.appointment-card{
    background:white;
    padding:20px;
    margin-top:15px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
    transition:.2s;
}

.appointment-card:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 18px rgba(0,0,0,.15);
}

.badge{
    padding:6px 12px;
    border-radius:20px;
    color:white;
}

.upcoming{
    background:#176235;
}

.completed{
    background:#2ecc71;
}

.cancelled{
    background:#e74c3c;
}

.missed{
    background:#f39c12;
}

/* Tables */

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

table th{
    background:#2c3e50;
    color:white;
}

table th,
table td{
    padding:12px;
    border:1px solid #ddd;
}

/* Sections */

.section{
    margin-top:40px;
}

/* Chart */

canvas{
    width:350px !important;
    height:350px !important;
    margin:auto;
}

/* Recommendation Grid */

.recommendation-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

    </style>

    {% block extra_css %}
    {% endblock %}

</head>

<body>

{% include "HomePage/navbar.html" %}

<div class="container">

    {% block content %}
    {% endblock %}

</div>

{% block extra_js %}
{% endblock %}
{% include "HomePage/footer.html" %}
</body>

</html>
